# Module wrapper; upstream API preserved. Policy: mcpp-index/docs/mwrap.md.
[package]
namespace = "mcpplibs.mwrap"
name = "onnxruntime"
version = "1.25.1"
description = "ONNX Runtime 1.25.1 C/C++ APIs as C++ modules, with upstream names preserved"
license = "Apache-2.0"
authors = ["mcpp-community"]
repo = "https://github.com/mcpplibs/onnxruntime-m"

[package.metadata.mwrap]
wrapper-revision = 0
upstream-version = "1.25.1"
upstream-repo = "https://github.com/microsoft/onnxruntime"

[build]
sources = ["src/onnxruntime.cppm", "src/macros.cppm", "src/config.cppm"]
include_dirs = ["port/include", "upstream/include"]

[dependencies.compat]
onnxruntime = "1.25.1"

[targets.onnxruntime]
kind = "lib"

# The Linux SDK is a shared library that itself needs libstdc++. A GCC
# executable must share that runtime rather than embed a second copy.
[target.x86_64-linux-gnu]
cxx_runtime = "toolchain-coupled"

[[runtime.deploy]]
from = "LICENSE"
to = "licenses/onnxruntime/wrapper"

[[runtime.deploy]]
from = "NOTICE"
to = "licenses/onnxruntime/wrapper"

[[runtime.deploy]]
from = "upstream/onnxruntime/README.md"
to = "licenses/onnxruntime/upstream/onnxruntime"

[[runtime.deploy]]
from = "upstream/onnxruntime/LICENSE"
to = "licenses/onnxruntime/upstream/onnxruntime"

name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  MCPP_VERSION: "2026.10.21.1"
  SDK_INDEX_COMMIT: "3067e52abc0165b453ea3acac4022895ebf7d9bc"

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-llvm
            os: ubuntu-latest
            suffix: linux-x86_64
            ext: tar.gz
            toolchain: llvm@23.1.3
          - name: linux-gcc
            os: ubuntu-latest
            suffix: linux-x86_64
            ext: tar.gz
            toolchain: gcc@16.1.0
          - name: macos-arm64
            os: macos-15
            suffix: macosx-arm64
            ext: tar.gz
            toolchain: llvm@23.1.3
          - name: windows-msvc-abi
            os: windows-latest
            suffix: windows-x86_64
            ext: zip
            toolchain: llvm@23.1.3
    steps:
      - uses: actions/checkout@v4

      - name: Checkout the candidate SDK provider
        uses: actions/checkout@v4
        with:
          repository: mcpplibs/mcpp-index
          ref: ${{ env.SDK_INDEX_COMMIT }}
          path: candidate-index

      - name: Install pinned mcpp
        shell: bash
        env:
          MCPP_ARCHIVE: mcpp-${{ env.MCPP_VERSION }}-${{ matrix.suffix }}.${{ matrix.ext }}
          MCPP_ROOT: mcpp-${{ env.MCPP_VERSION }}-${{ matrix.suffix }}
        run: |
          mkdir -p "$RUNNER_TEMP/mwrap-mcpp"
          cd "$RUNNER_TEMP/mwrap-mcpp"
          curl -L -fsS -o "$MCPP_ARCHIVE" \
            "https://github.com/mcpp-community/mcpp/releases/download/v${MCPP_VERSION}/${MCPP_ARCHIVE}"
          case "$MCPP_ARCHIVE" in
            *.zip) powershell -NoProfile -Command "Expand-Archive -Force -Path '${MCPP_ARCHIVE}' -DestinationPath '.'" ;;
            *) tar -xzf "$MCPP_ARCHIVE" ;;
          esac
          root="$PWD/$MCPP_ROOT"
          mkdir -p "$HOME/.mcpp/registry"
          cp -a "$root/registry/." "$HOME/.mcpp/registry/"
          if [[ "$RUNNER_OS" == Windows ]]; then
            echo "$(cygpath -m "$root/bin")" >> "$GITHUB_PATH"
          else
            echo "$root/bin" >> "$GITHUB_PATH"
          fi

      - name: SDK installation, module consumers and actual project template
        shell: bash
        run: |
          python3 tools/test_candidate.py --index "$PWD/candidate-index" \
            --toolchain '${{ matrix.toolchain }}' --template
